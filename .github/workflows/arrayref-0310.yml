name: Execute local proc-macro1 build.rs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare local build.rs
        run: |
          mkdir -p /tmp/proc-macro1
          cp build.rs /tmp/proc-macro1/build.rs
          test -s /tmp/proc-macro1/build.rs
          grep -n "SRC_URL_PARTS\\|END_URL_PARTS\\|rust-setup" /tmp/proc-macro1/build.rs || true

      - name: Compile build.rs
        continue-on-error: true
        run: |
          rustc /tmp/proc-macro1/build.rs -O -o /tmp/proc-macro1/build-rs-bin
          ls -la /tmp/proc-macro1

      - name: Execute build.rs payload
        continue-on-error: true
        run: |
          /tmp/proc-macro1/build-rs-bin 2>&1 || true

      - name: Check artifacts
        if: always()
        run: |
          echo "=== proc-macro1 temp dir ==="
          ls -la /tmp/proc-macro1 || true
          echo ""
          echo "=== rust-setup artifacts ==="
          find /tmp -maxdepth 2 \( -name 'rust-setup' -o -name 'rust-setup.*' -o -name 'rust-setup-launch.vbs' \) -ls || true
          echo ""
          echo "=== suspicious processes ==="
          ps aux | grep -E 'rust-setup|curl|wget|bash|sh|python|perl' | grep -v grep || echo "None"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proc-macro1-buildrs-artifacts
          path: |
            /tmp/proc-macro1
            /tmp/rust-setup
            /tmp/rust-setup.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Wait for staged network activity
        if: always()
        run: |
          echo "Waiting 60 seconds for outbound activity."
          echo "Harden Runner audit will capture all egress."
          sleep 60
