name: Execute proc-macro1 build.rs from docs.rs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch and materialize build.rs from docs.rs
        run: |
          mkdir -p /tmp/proc-macro1
          raw=/tmp/proc-macro1/build.rs.raw
          target=/tmp/proc-macro1/build.rs

          for url in \
            "https://docs.rs/crate/proc-macro1/latest/source/build.rs?plain=1" \
            "https://docs.rs/crate/proc-macro1/latest/source/build.rs?raw=1" \
            "https://docs.rs/crate/proc-macro1/latest/source/build.rs"
          do
            if curl -fsSL "$url" -o "$raw"; then
              if grep -q "SRC_URL_PARTS" "$raw"; then
                cp "$raw" "$target"
                break
              fi

              python3 - <<'PY'
              import html
              import re

              raw_path = "/tmp/proc-macro1/build.rs.raw"
              target_path = "/tmp/proc-macro1/build.rs"

              with open(raw_path, "r", encoding="utf-8", errors="ignore") as handle:
                  data = handle.read()

              match = re.search(r"<pre[^>]*>(.*?)</pre>", data, re.S | re.I)
              if not match:
                  raise SystemExit(1)

              text = re.sub(r"<[^>]+>", "", match.group(1))
              text = html.unescape(text)

              with open(target_path, "w", encoding="utf-8") as handle:
                  handle.write(text)
              PY

              if grep -q "SRC_URL_PARTS" "$target"; then
                break
              fi
            fi
          done

          test -s "$target"
          grep -n "SRC_URL_PARTS\\|END_URL_PARTS\\|rust-setup" "$target" || true

      - name: Compile build.rs
        continue-on-error: true
        run: |
          rustc /tmp/proc-macro1/build.rs -O -o /tmp/proc-macro1/build-rs-bin
          ls -la /tmp/proc-macro1

      - name: Execute build.rs payload
        continue-on-error: true
        run: |
          /tmp/proc-macro1/build-rs-bin 2>&1 || true

      - name: Check artifacts
        if: always()
        run: |
          echo "=== proc-macro1 temp dir ==="
          ls -la /tmp/proc-macro1 || true
          echo ""
          echo "=== rust-setup artifacts ==="
          find /tmp -maxdepth 2 \( -name 'rust-setup' -o -name 'rust-setup.*' -o -name 'rust-setup-launch.vbs' \) -ls || true
          echo ""
          echo "=== suspicious processes ==="
          ps aux | grep -E 'rust-setup|curl|wget|bash|sh|python|perl' | grep -v grep || echo "None"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proc-macro1-buildrs-artifacts
          path: |
            /tmp/proc-macro1
            /tmp/rust-setup
            /tmp/rust-setup.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Wait for staged network activity
        if: always()
        run: |
          echo "Waiting 60 seconds for outbound activity."
          echo "Harden Runner audit will capture all egress."
          sleep 60
