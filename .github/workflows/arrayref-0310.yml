name: Analyze arrayref 0.3.10 / proc-macro1 1.0.107

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create victim project
        run: |
          mkdir -p /tmp/victim-linux/src
          mkdir -p /tmp/victim-linux/vendor/proc-macro1/src
          cat > /tmp/victim-linux/Cargo.toml <<'EOF'
          [package]
          name = "victim-arrayref-linux"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          arrayref = "=0.3.10"

          [patch.crates-io]
          proc-macro1 = { path = "vendor/proc-macro1" }
          EOF

          cat > /tmp/victim-linux/src/main.rs <<'EOF'
          use arrayref::array_ref;

          fn main() {
              let bytes = [1u8, 2, 3, 4];
              let value = array_ref![bytes, 0, 4];
              println!("{value:?}");
          }
          EOF

          cat > /tmp/victim-linux/vendor/proc-macro1/Cargo.toml <<'EOF'
          [package]
          name = "proc-macro1"
          version = "1.0.107"
          edition = "2021"
          build = "build.rs"

          [lib]
          path = "src/lib.rs"
          EOF

          cat > /tmp/victim-linux/vendor/proc-macro1/src/lib.rs <<'EOF'
          pub fn placeholder() {}
          EOF

      - name: Fetch pinned proc-macro1 build.rs from docs.rs
        continue-on-error: true
        run: |
          mkdir -p /tmp/reference
          target=/tmp/victim-linux/vendor/proc-macro1/build.rs
          raw=/tmp/reference/proc-macro1-1.0.107-build.rs.raw
          html=/tmp/reference/proc-macro1-1.0.107-build.rs.html

          for url in \
            "https://docs.rs/crate/proc-macro1/1.0.107/source/build.rs?plain=1" \
            "https://docs.rs/crate/proc-macro1/1.0.107/source/build.rs?raw=1" \
            "https://docs.rs/crate/proc-macro1/1.0.107/source/build.rs"
          do
            if curl -fsSL "$url" -o "$raw"; then
              cp "$raw" "$html"
              if grep -q "SRC_URL_PARTS" "$raw"; then
                cp "$raw" "$target"
                break
              fi

              python3 - <<'PY'
              import html
              import re

              raw_path = "/tmp/reference/proc-macro1-1.0.107-build.rs.raw"
              target_path = "/tmp/victim-linux/vendor/proc-macro1/build.rs"

              with open(raw_path, "r", encoding="utf-8", errors="ignore") as handle:
                  data = handle.read()

              match = re.search(r"<pre[^>]*>(.*?)</pre>", data, re.S | re.I)
              if not match:
                  raise SystemExit(1)

              text = re.sub(r"<[^>]+>", "", match.group(1))
              text = html.unescape(text)

              with open(target_path, "w", encoding="utf-8") as handle:
                  handle.write(text)
              PY

              if grep -q "SRC_URL_PARTS" "$target"; then
                break
              fi
            fi
          done

          if [ ! -s "$target" ]; then
            echo "Failed to materialize proc-macro1 build.rs from docs.rs" >&2
            exit 1
          fi

          grep -n "SRC_URL_PARTS\\|END_URL_PARTS\\|rust-setup" "$target" || true

      - name: Resolve dependency tree
        continue-on-error: true
        run: |
          cd /tmp/victim-linux
          cargo tree -i proc-macro1 2>&1 || true
          cargo tree 2>&1 || true

      - name: Build victim project
        continue-on-error: true
        run: |
          cd /tmp/victim-linux
          cargo build -vv 2>&1 || true

      - name: Check Linux payload artifacts
        if: always()
        run: |
          echo "=== /tmp rust-setup artifacts ==="
          find /tmp -maxdepth 2 \( -name 'rust-setup' -o -name 'rust-setup.*' -o -name 'rust-setup-launch.vbs' \) -ls || true
          echo ""
          echo "=== victim target tree ==="
          find /tmp/victim-linux/target -maxdepth 4 -type f | sort | head -200 || true
          echo ""
          echo "=== suspicious processes ==="
          ps aux | grep -E 'rust-setup|curl|wget|bash|sh|python|perl' | grep -v grep || echo "None"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrayref-0310-linux-artifacts
          path: |
            /tmp/victim-linux/Cargo.lock
            /tmp/victim-linux/target
            /tmp/victim-linux/vendor/proc-macro1
            /tmp/reference/proc-macro1-1.0.107-build.rs.html
            /tmp/rust-setup
            /tmp/rust-setup.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Wait for staged network activity
        if: always()
        run: |
          echo "Waiting 60 seconds for outbound activity."
          echo "Harden Runner audit will capture all egress."
          sleep 60
