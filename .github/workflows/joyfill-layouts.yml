name: Analyze @joyfill/layouts Compromised Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install compromised package without lifecycle scripts
        continue-on-error: true
        run: |
          mkdir -p victim-project
          cd victim-project
          npm init -y
          npm install @joyfill/layouts@0.1.2-2773.beta.0 --ignore-scripts 2>&1 || true

      - name: Import package to trigger CommonJS entrypoint payload
        continue-on-error: true
        run: |
          cd victim-project
          node -e "try { require('@joyfill/layouts'); } catch (error) { console.log('Require error:', error.message); }  setTimeout(() => {}, 30000)" 2>&1 || true
