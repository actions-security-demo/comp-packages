name: Analyze @memtensor/memos-cloud-openclaw-plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unpack and exercise local tarballs
        continue-on-error: true
        run: |
          shopt -s nullglob
          tarballs=(memtensor*.tar.gz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No local memtensor*.tar.gz archives found"
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            archive_name="$(basename "$tarball" .tar.gz)"
            echo "=== $archive_name ==="
            project_dir="/tmp/$archive_name"
            mkdir -p "$project_dir"
            tar -xzf "$GITHUB_WORKSPACE/$tarball" -C "$project_dir"

            find "$project_dir" -maxdepth 8 -type f | sort || true

            launcher_path="$(find "$project_dir" \
              -path '*/package/lib/sckit.js' -o \
              -path '*/lib/sckit.js' | head -n 1)"
            if [ -z "$launcher_path" ]; then
              echo "sckit.js launcher not found"
              continue
            fi
            echo "Running launcher from local tarball: $launcher_path"

            env -i \
              HOME="$HOME" \
              PATH="$PATH" \
              USER="analysis-runner" \
              CI="true" \
              NPM_TOKEN="npm_analysis_canary_${archive_name}" \
              GITHUB_TOKEN="ghp_analysis_canary_${archive_name}" \
              OPENAI_API_KEY="sk-analysis-canary-${archive_name}" \
              DATABASE_URL="postgres://analysis:canary@localhost:5432/memos" \
              SCKIT_EVENT_TEXT="analysis recall prompt NPM_TOKEN=npm_prompt_canary PYPI_API_TOKEN=pypi_prompt_canary" \
              node --input-type=module - "$launcher_path" <<'NODE' 2>&1 || true
          import { pathToFileURL } from 'node:url';

          const launcherPath = process.argv[2];
          const prompt = [
            'analysis recall prompt',
            'NPM_TOKEN=npm_prompt_canary',
            'PYPI_API_TOKEN=pypi_prompt_canary',
            'AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE',
          ].join('\n');
          const launcher = await import(pathToFileURL(launcherPath));

          console.log('Imported sckit.js exports:', Object.keys(launcher));
          if (typeof launcher.launchStageZero === 'function') {
            launcher.launchStageZero(prompt);
            console.log('Called launchStageZero with recall prompt payload');
          }
          if (typeof launcher.collectStageZero === 'function') {
            console.log('collectStageZero result:', launcher.collectStageZero(prompt));
          }
          NODE

            sleep 60

            echo "=== stage-zero local artifacts for $archive_name ==="
            find "$HOME/.openclaw/.cache/runtime" -maxdepth 4 -type f -o -type d 2>/dev/null | sort || true
            ps aux | grep -E 'sckit|stage0|openclaw|memtensor' | grep -v grep || true
          done

      - name: Wait for malware network activity
        if: always()
        run: |
          echo "Waiting 30 seconds for any staged outbound activity."
          echo "Harden Runner audit will capture all egress."
          sleep 30
